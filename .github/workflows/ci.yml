name: CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_VERSION: "6.2.0"
  POSTGRES_MAJOR: "18"
  WINDOWS_POSTGRES_VERSION: "18.6.3"

jobs:
  # Fast static/code-quality verification using the repository's canonical script.
  code-quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Run code quality verification
        run: scripts/ci/verify-code-quality.sh

  # Complete backend qualification on Linux.
  backend-linux:
    name: Backend Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Verify backend
        run: mvn -B -ntp -Dplatform=linux verify

  # Exercise native backend behavior on the other supported operating systems.
  platform-tests:
    name: Backend Tests (${{ matrix.display-platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            display-platform: Windows
          - os: macos-15-intel
            platform: macos
            display-platform: macOS

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Run native backend tests
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: mvn -B -ntp "-Dplatform=$TEST_PLATFORM" test

  # Frontend unit/catalog/contract tests plus the complete Playwright E2E suite.
  frontend-linux:
    name: Frontend + E2E Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # setup-e2e-schema.sh uses the real PostgreSQL client tools.
      - name: Install PostgreSQL client
        working-directory: ${{ github.workspace }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg

          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null

          . /etc/os-release

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "postgresql-client-${POSTGRES_MAJOR}"

          echo "/usr/lib/postgresql/${POSTGRES_MAJOR}/bin" >> "$GITHUB_PATH"

      # Local application-e2e.yml remains ignored. CI creates a disposable one.
      - name: Configure E2E backend
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/cestereg-e2e-assets/audio/snippets"
          mkdir -p "$RUNNER_TEMP/cestereg-e2e-assets/audio/answers"
          mkdir -p "$RUNNER_TEMP/cestereg-e2e-assets/images/teams"
          mkdir -p "$RUNNER_TEMP/cestereg-e2e-assets/images/albums"

          cat > apps/backend/src/main/resources/application-e2e.yml <<EOF
          spring:
            datasource:
              url: "jdbc:postgresql://127.0.0.1:2345/rhytmicriddles?currentSchema=e2e"
              username: "rhytmicriddles"
              password: "change_me"
            jpa:
              properties:
                hibernate:
                  default_schema: e2e

          app:
            assets:
              base-dir: "$RUNNER_TEMP/cestereg-e2e-assets"
          EOF

      - name: Start E2E PostgreSQL
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f docker-compose.yml.example up -d db

          for i in {1..60}; do
            if docker compose -f docker-compose.yml.example exec -T db \
              pg_isready \
              -h 127.0.0.1 \
              -p 5432 \
              -U rhytmicriddles \
              -d rhytmicriddles
            then
              exit 0
            fi

            sleep 1
          done

          docker compose -f docker-compose.yml.example logs db
          exit 1

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend test suite
        run: |
          set -euo pipefail

          BACKEND_LOG="$RUNNER_TEMP/backend-e2e.log"
          FRONTEND_LOG="$RUNNER_TEMP/frontend-e2e.log"

          cleanup() {
            kill "${FRONTEND_PID:-}" 2>/dev/null || true
            kill "${BACKEND_PID:-}" 2>/dev/null || true
          }

          trap cleanup EXIT

          (
            cd ../backend
            exec mvn -B -ntp spring-boot:run -Pe2e -De2e.clean=true
          ) >"$BACKEND_LOG" 2>&1 &
          BACKEND_PID=$!

          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null; then
              break
            fi

            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              cat "$BACKEND_LOG"
              exit 1
            fi

            if [ "$i" -eq 180 ]; then
              cat "$BACKEND_LOG"
              exit 1
            fi

            sleep 1
          done

          npm start >"$FRONTEND_LOG" 2>&1 &
          FRONTEND_PID=$!

          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:4200 >/dev/null; then
              break
            fi

            if ! kill -0 "$FRONTEND_PID" 2>/dev/null; then
              cat "$FRONTEND_LOG"
              exit 1
            fi

            if [ "$i" -eq 120 ]; then
              cat "$FRONTEND_LOG"
              exit 1
            fi

            sleep 1
          done

          npm run test:all

      - name: Build production frontend
        run: npm run build -- --configuration production

      - name: Stop E2E PostgreSQL
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -f docker-compose.yml.example down -v

  # Firmware host tests plus compilation for the actual Arduino target.
  firmware:
    name: Firmware Tests + Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install PlatformIO
        run: |
          python -m pip install "platformio==${PLATFORMIO_VERSION}"
          pio --version

      - name: Run firmware unit tests
        run: pio test -d hardware/firmware/receiver -e native

      - name: Build Arduino firmware
        run: pio run -d hardware/firmware/receiver -e nanoatmega328

  # Package qualification waits only for the fast quality gate, then runs in parallel with tests.
  # All three supported packages must still succeed before Merge Gate can pass.
  linux-package:
    name: Package Qualification (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    needs:
      - code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      # Fetch baseline-data from github releases
      - name: Prepare baseline data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASELINE_TAG="baseline-data-v1"
          BASELINE_ARCHIVE="${RUNNER_TEMP}/baseline-data/baseline-data.zip"

          mkdir -p "${RUNNER_TEMP}/baseline-data"

          gh release download "$BASELINE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "baseline-data.zip" \
            --dir "${RUNNER_TEMP}/baseline-data"

          gh release verify-asset "$BASELINE_TAG" "$BASELINE_ARCHIVE" \
            --repo "$GITHUB_REPOSITORY"

          unzip -o "$BASELINE_ARCHIVE" -d .

      - name: Prepare production configuration
        shell: bash
        run: |
          cat > apps/backend/src/main/resources/application-production.yml <<'EOF'
          management:
            server:
              port: 8081
              address: 127.0.0.1
            endpoints:
              web:
                exposure:
                  include: shutdown,health,info
            endpoint:
              shutdown:
                enabled: true
          EOF

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # The embedded package builder copies the real PostgreSQL 18 client.
      - name: Install PostgreSQL 18 client and packaging dependencies
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg

          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null

          . /etc/os-release

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "postgresql-client-${POSTGRES_MAJOR}" \
            fakeroot

          echo "/usr/lib/postgresql/${POSTGRES_MAJOR}/bin" >> "$GITHUB_PATH"

      # Package tests run in dedicated qualification jobs; skip test compilation here too.
      - name: Build Linux production package
        env:
          MAVEN_ARGS: "-Dmaven.test.skip=true"
        run: bash scripts/prod/build/build_linux_jpackage.sh --embeddb=true

      - name: Install Playwright Chromium
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Require Linux installer
        shell: bash
        run: |
          if ! find dist/linux/out -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .; then
            echo "Expected .deb installer was not produced."
            exit 1
          fi

      - name: Smoke Linux production package
        run: |
          node scripts/prod/package-smoke.mjs \
            --app dist/linux/out/cestereg/bin/cestereg \
            --embeddb true

  windows-package:
    name: Package Qualification (Windows)
    runs-on: windows-2025
    timeout-minutes: 60

    needs:
      - code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      # Fetch baseline-data from github releases
      - name: Prepare baseline data
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "baseline-data-v1"
          $dir = Join-Path $env:RUNNER_TEMP "baseline-data"
          $archive = Join-Path $dir "baseline-data.zip"

          New-Item -ItemType Directory -Force $dir | Out-Null

          gh release download $tag `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern "baseline-data.zip" `
            --dir $dir

          if ($LASTEXITCODE -ne 0) {
            throw "Baseline data download failed."
          }

          gh release verify-asset $tag $archive `
            --repo "$env:GITHUB_REPOSITORY"

          if ($LASTEXITCODE -ne 0) {
            throw "Baseline data release verification failed."
          }

          Expand-Archive -Path $archive -DestinationPath "." -Force

      - name: Prepare production configuration
        shell: bash
        run: |
          cat > apps/backend/src/main/resources/application-production.yml <<'EOF'
          management:
            server:
              port: 8081
              address: 127.0.0.1
            endpoints:
              web:
                exposure:
                  include: shutdown,health,info
            endpoint:
              shutdown:
                enabled: true
          EOF

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # The packer needs psql + runtime DLLs, not an installed/running PostgreSQL server.
      - name: Cache PostgreSQL 18 client binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\postgresql-ci\${{ env.WINDOWS_POSTGRES_VERSION }}
          key: windows-postgresql-client-${{ env.WINDOWS_POSTGRES_VERSION }}-x64-v1

      - name: Prepare PostgreSQL 18 client
        shell: pwsh
        run: |
          $root = Join-Path $HOME "postgresql-ci\$env:WINDOWS_POSTGRES_VERSION"
          $pgHome = Join-Path $root "pgsql"
          $psql = Join-Path $pgHome "bin\psql.exe"

          if (-not (Test-Path $psql)) {
            New-Item -ItemType Directory -Force $root | Out-Null

            $archive = Join-Path $env:RUNNER_TEMP "postgresql-$env:WINDOWS_POSTGRES_VERSION.zip"
            $edbVersion = $env:WINDOWS_POSTGRES_VERSION -replace '\.(\d+)$', '-$1'
            $url = "https://get.enterprisedb.com/postgresql/postgresql-$edbVersion-windows-x64-binaries.zip"

            curl.exe -fL --retry 3 --output $archive $url
            if ($LASTEXITCODE -ne 0) {
              throw "PostgreSQL client download failed with exit code $LASTEXITCODE"
            }

            # Extract only bin/: the Windows pg-client packer discovers psql from PATH and bundles its DLLs.
            tar.exe -xf $archive -C $root pgsql/bin
            if ($LASTEXITCODE -ne 0) {
              throw "PostgreSQL client extraction failed with exit code $LASTEXITCODE"
            }
            Remove-Item $archive -Force
          }

          if (-not (Test-Path $psql)) {
            throw "PostgreSQL $env:POSTGRES_MAJOR psql.exe was not prepared at $psql"
          }

          "$pgHome\bin" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          & $psql --version

      # Package tests run in dedicated qualification jobs; skip test compilation here too.
      - name: Build Windows production package
        shell: pwsh
        env:
          MAVEN_ARGS: "-Dmaven.test.skip=true"
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File `
            scripts/prod/build/build_windows_jpackage.ps1 `
            -embeddb true

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install Playwright Chromium
        working-directory: apps/frontend
        run: npx playwright install chromium

      # The current builder can warn if MSI creation fails, so CI requires it explicitly.
      - name: Require Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            -Path "dist/windows/out" `
            -Filter "*.msi" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $installer) {
            throw "Expected MSI installer was not produced."
          }

      - name: Smoke Windows production package
        shell: pwsh
        run: |
          node scripts/prod/package-smoke.mjs `
            --app dist/windows/out/cestereg/cestereg.exe `
            --embeddb true

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  macos-package:
    name: Package Qualification (macOS)
    runs-on: macos-15-intel
    timeout-minutes: 60

    needs:
      - code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      # Fetch baseline-data from github releases
      - name: Prepare baseline data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASELINE_TAG="baseline-data-v1"
          BASELINE_ARCHIVE="${RUNNER_TEMP}/baseline-data/baseline-data.zip"

          mkdir -p "${RUNNER_TEMP}/baseline-data"

          gh release download "$BASELINE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "baseline-data.zip" \
            --dir "${RUNNER_TEMP}/baseline-data"

          gh release verify-asset "$BASELINE_TAG" "$BASELINE_ARCHIVE" \
            --repo "$GITHUB_REPOSITORY"

          unzip -o "$BASELINE_ARCHIVE" -d .

      - name: Prepare production configuration
        shell: bash
        run: |
          cat > apps/backend/src/main/resources/application-production.yml <<'EOF'
          management:
            server:
              port: 8081
              address: 127.0.0.1
            endpoints:
              web:
                exposure:
                  include: shutdown,health,info
            endpoint:
              shutdown:
                enabled: true
          EOF

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # The macOS packer expects the PostgreSQL 18 installation under /Library/PostgreSQL/18.
      - name: Install PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail

          brew install "postgresql@${POSTGRES_MAJOR}"

          PG_HOME="$(brew --prefix "postgresql@${POSTGRES_MAJOR}")"

          sudo mkdir -p /Library/PostgreSQL
          sudo rm -rf "/Library/PostgreSQL/${POSTGRES_MAJOR}"
          sudo ln -s "$PG_HOME" "/Library/PostgreSQL/${POSTGRES_MAJOR}"

          test -x "/Library/PostgreSQL/${POSTGRES_MAJOR}/bin/psql"

          echo "$PG_HOME/bin" >> "$GITHUB_PATH"

      # Package tests run in dedicated qualification jobs; skip test compilation here too.
      - name: Build macOS production package
        env:
          MAVEN_ARGS: "-Dmaven.test.skip=true"
        run: bash scripts/prod/build/build_macos_jpackage.sh --embeddb=true

      - name: Install Playwright Chromium
        working-directory: apps/frontend
        run: npx playwright install chromium

      - name: Require macOS installer
        shell: bash
        run: |
          if ! find dist/macos/out -maxdepth 1 -type f -name '*.dmg' -print -quit | grep -q .; then
            echo "Expected DMG installer was not produced."
            exit 1
          fi

      - name: Smoke macOS production package
        run: |
          node scripts/prod/package-smoke.mjs \
            --app dist/macos/out/cestereg.app/Contents/MacOS/cestereg \
            --embeddb true

  # One stable branch-protection contract. Every supported platform must pass.
  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()

    needs:
      - code-quality
      - backend-linux
      - frontend-linux
      - firmware
      - platform-tests
      - linux-package
      - windows-package
      - macos-package

    steps:
      - name: Verify required qualification jobs
        env:
          CODE_QUALITY_RESULT: ${{ needs['code-quality'].result }}
          BACKEND_RESULT: ${{ needs['backend-linux'].result }}
          FRONTEND_RESULT: ${{ needs['frontend-linux'].result }}
          FIRMWARE_RESULT: ${{ needs['firmware'].result }}
          PLATFORM_RESULT: ${{ needs['platform-tests'].result }}
          LINUX_PACKAGE_RESULT: ${{ needs['linux-package'].result }}
          WINDOWS_PACKAGE_RESULT: ${{ needs['windows-package'].result }}
          MACOS_PACKAGE_RESULT: ${{ needs['macos-package'].result }}
        run: |
          echo "Code Quality:                     $CODE_QUALITY_RESULT"
          echo "Backend Tests (Linux):            $BACKEND_RESULT"
          echo "Backend Tests (Windows/macOS):    $PLATFORM_RESULT"
          echo "Frontend + E2E Tests (Linux):     $FRONTEND_RESULT"
          echo "Firmware Tests + Build:           $FIRMWARE_RESULT"
          echo "Package Qualification (Linux):    $LINUX_PACKAGE_RESULT"
          echo "Package Qualification (Windows):  $WINDOWS_PACKAGE_RESULT"
          echo "Package Qualification (macOS):    $MACOS_PACKAGE_RESULT"

          if [[ "$CODE_QUALITY_RESULT" != "success" ||
                "$BACKEND_RESULT" != "success" ||
                "$FRONTEND_RESULT" != "success" ||
                "$FIRMWARE_RESULT" != "success" ||
                "$PLATFORM_RESULT" != "success" ||
                "$LINUX_PACKAGE_RESULT" != "success" ||
                "$WINDOWS_PACKAGE_RESULT" != "success" ||
                "$MACOS_PACKAGE_RESULT" != "success" ]]; then
            echo "One or more required qualification jobs failed or were skipped."
            exit 1
          fi

          echo "All required cross-platform qualification jobs passed."
