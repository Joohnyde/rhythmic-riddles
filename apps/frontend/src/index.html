<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cestereg</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#100b1b" />
    <style>
      :root {
        --app-bg: #100b1b;
        --app-bg-secondary: #161023;
        --app-surface: #1b142e;
        --app-border: #392c50;
        --app-primary: #b53dd6;
        --app-secondary: #3eb8f0;
        --app-accent: #ff6a5f;
        --app-warm: #ff9f6e;
        --app-text: #f2e9ff;
        --app-text-muted: #a99db9;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: var(--app-bg);
        background:
          radial-gradient(circle at 20% 0%, rgba(181, 61, 214, 0.18), transparent 32rem),
          radial-gradient(circle at 90% 35%, rgba(62, 184, 240, 0.12), transparent 30rem),
          linear-gradient(145deg, var(--app-bg), var(--app-bg-secondary));
        color: var(--app-text);
        font-family:
          'Novecento Sans',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      .app-boot-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        box-sizing: border-box;
      }

      .app-boot-card {
        background: rgba(27, 20, 46, 0.92);
        border: 1px solid var(--app-border);
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        width: 90%;
        max-width: 440px;
        text-align: center;
        box-shadow:
          0 20px 60px rgba(5, 2, 15, 0.55),
          0 0 40px rgba(181, 61, 214, 0.14);
        box-sizing: border-box;
      }

      .app-boot-orbit {
        width: 100px;
        height: 100px;
        margin: 0 auto 1.5rem;
        position: relative;
        display: grid;
        place-items: center;
      }

      .app-boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        background:
          linear-gradient(var(--app-surface), var(--app-surface)) padding-box,
          conic-gradient(
              from 0deg,
              var(--app-warm),
              var(--app-accent) 35%,
              var(--app-primary) 70%,
              var(--app-secondary) 100%
            )
            border-box;
        animation: appBootSpin 3s linear infinite;
        box-shadow: 0 0 24px rgba(181, 61, 214, 0.28);
      }

      @keyframes appBootSpin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .app-boot-glyph {
        font-size: 2.8rem;
        line-height: 1;
        font-weight: 900;
        background: linear-gradient(
          145deg,
          var(--app-warm),
          var(--app-accent) 38%,
          var(--app-primary) 70%,
          var(--app-secondary)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        z-index: 2;
        transform: translateY(-2px);
      }

      .app-boot-title {
        margin: 0 0 0.35rem;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        background: linear-gradient(
          135deg,
          var(--app-warm) 0%,
          var(--app-accent) 35%,
          var(--app-primary) 70%,
          var(--app-secondary) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .app-boot-subtitle {
        color: var(--app-accent);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.72rem;
        margin: 0 0 1.25rem;
      }

      .app-boot-equalizer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        height: 28px;
        margin: 0.75rem 0 1rem;
      }

      .app-boot-bar {
        width: 4px;
        height: 100%;
        border-radius: 3px;
        animation: appBootBounce 1.2s ease-in-out infinite alternate;
      }

      .app-boot-bar:nth-child(1) {
        background: var(--app-warm);
        animation-delay: 0s;
        height: 12px;
      }
      .app-boot-bar:nth-child(2) {
        background: var(--app-accent);
        animation-delay: 0.18s;
        height: 20px;
      }
      .app-boot-bar:nth-child(3) {
        background: var(--app-primary);
        animation-delay: 0.36s;
        height: 28px;
      }
      .app-boot-bar:nth-child(4) {
        background: var(--app-secondary);
        animation-delay: 0.54s;
        height: 18px;
      }
      .app-boot-bar:nth-child(5) {
        background: #db8ef1;
        animation-delay: 0.72s;
        height: 14px;
      }

      @keyframes appBootBounce {
        0% {
          transform: scaleY(0.35);
          opacity: 0.55;
        }
        100% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      .app-boot-status {
        color: #d6cde2;
        font-size: 0.92rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-boot-container">
        <div class="app-boot-card">
          <div class="app-boot-orbit">
            <div class="app-boot-ring"></div>
            <div class="app-boot-glyph">&#9835;</div>
          </div>
          <h1 class="app-boot-title">RHYTHMIC RIDDLES</h1>
          <div class="app-boot-subtitle">Real-time Music Quiz Game</div>
          <div class="app-boot-equalizer">
            <div class="app-boot-bar"></div>
            <div class="app-boot-bar"></div>
            <div class="app-boot-bar"></div>
            <div class="app-boot-bar"></div>
            <div class="app-boot-bar"></div>
          </div>
          <p class="app-boot-status">Loading client application...</p>
        </div>
      </div>
    </app-root>
  </body>
</html>
