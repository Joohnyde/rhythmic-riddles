<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#100b1b" />
    <title>Rhythmic Riddles — Starting...</title>
    <style>
      :root {
        --background: #100b1b;
        --background-secondary: #161023;
        --surface: #1b142e;
        --surface-raised: #211838;
        --border: #392c50;
        --border-subtle: rgba(242, 233, 255, 0.08);
        --primary: #b53dd6;
        --secondary: #3eb8f0;
        --accent: #ff6a5f;
        --warm: #ff9f6e;
        --text: #f2e9ff;
        --text-secondary: #d6cde2;
        --text-muted: #a99db9;
        --success: #45bd8e;
        --danger: #f65b50;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--background);
        background:
          radial-gradient(circle at 20% 0%, rgba(181, 61, 214, 0.18), transparent 32rem),
          radial-gradient(circle at 90% 35%, rgba(62, 184, 240, 0.12), transparent 30rem),
          linear-gradient(145deg, var(--background), var(--background-secondary));
        color: var(--text);
        font-family: 'Novecento Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
      }

      .splash-card {
        background: rgba(27, 20, 46, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        width: 90%;
        max-width: 440px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(5, 2, 15, 0.55), 0 0 40px rgba(181, 61, 214, 0.14);
        position: relative;
        animation: cardFadeIn 0.5s ease-out;
      }

      @keyframes cardFadeIn {
        from { opacity: 0; transform: translateY(12px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .brand-orbit {
        width: 100px;
        height: 100px;
        margin: 0 auto 1.5rem;
        position: relative;
        display: grid;
        place-items: center;
      }

      .orbit-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        background:
          linear-gradient(var(--surface), var(--surface)) padding-box,
          conic-gradient(from 0deg, var(--warm), var(--accent) 35%, var(--primary) 70%, var(--secondary) 100%) border-box;
        animation: spin 3s linear infinite;
        box-shadow: 0 0 24px rgba(181, 61, 214, 0.28);
      }

      .orbit-ring.ready {
        background:
          linear-gradient(var(--surface), var(--surface)) padding-box,
          conic-gradient(from 0deg, var(--success), #72efc2, var(--success)) border-box;
        box-shadow: 0 0 24px rgba(69, 189, 142, 0.4);
      }

      .orbit-ring.failed {
        animation: none;
        background:
          linear-gradient(var(--surface), var(--surface)) padding-box,
          conic-gradient(from 0deg, var(--danger), #ff9990, var(--danger)) border-box;
        box-shadow: 0 0 24px rgba(246, 91, 80, 0.35);
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .music-glyph {
        font-size: 2.8rem;
        line-height: 1;
        font-weight: 900;
        background: linear-gradient(145deg, var(--warm), var(--accent) 38%, var(--primary) 70%, var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        z-index: 2;
        transform: translateY(-2px);
      }

      .music-glyph.failed {
        background: linear-gradient(145deg, #ffa099, var(--danger));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .title {
        margin: 0 0 0.35rem;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        background: linear-gradient(135deg, var(--warm) 0%, var(--accent) 35%, var(--primary) 70%, var(--secondary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        color: var(--accent);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.72rem;
        margin: 0 0 1.25rem;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(181, 61, 214, 0.12);
        border: 1px solid rgba(181, 61, 214, 0.32);
        color: #ecbdf9;
        margin-bottom: 1.25rem;
        transition: all 0.3s ease;
      }

      .status-pill.ready {
        background: rgba(69, 189, 142, 0.15);
        border-color: rgba(69, 189, 142, 0.4);
        color: var(--success);
      }

      .status-pill.failed {
        background: rgba(246, 91, 80, 0.15);
        border-color: rgba(246, 91, 80, 0.4);
        color: var(--danger);
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--primary);
        box-shadow: 0 0 8px var(--primary);
        animation: pulse 1.4s ease-in-out infinite;
      }

      .status-pill.ready .pulse-dot {
        background-color: var(--success);
        box-shadow: 0 0 8px var(--success);
      }

      .status-pill.failed .pulse-dot {
        background-color: var(--danger);
        box-shadow: 0 0 8px var(--danger);
        animation: none;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }

      .equalizer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        height: 28px;
        margin: 0.75rem 0 1rem;
      }

      .bar {
        width: 4px;
        height: 100%;
        border-radius: 3px;
        animation: bounce 1.2s ease-in-out infinite alternate;
      }

      .bar:nth-child(1) { background: var(--warm); animation-delay: 0s; height: 12px; }
      .bar:nth-child(2) { background: var(--accent); animation-delay: 0.18s; height: 20px; }
      .bar:nth-child(3) { background: var(--primary); animation-delay: 0.36s; height: 28px; }
      .bar:nth-child(4) { background: var(--secondary); animation-delay: 0.54s; height: 18px; }
      .bar:nth-child(5) { background: #db8ef1; animation-delay: 0.72s; height: 14px; }

      @keyframes bounce {
        0% { transform: scaleY(0.35); opacity: 0.55; }
        100% { transform: scaleY(1); opacity: 1; }
      }

      .status-msg {
        color: var(--text-secondary);
        font-size: 0.92rem;
        margin: 0 0 0.5rem;
        min-height: 1.4rem;
      }

      .target-url {
        color: var(--text-muted);
        font-size: 0.78rem;
        font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
        letter-spacing: 0.02em;
      }

      .error-panel {
        display: none;
        margin-top: 1.25rem;
        padding: 1rem 1.15rem;
        background: rgba(45, 17, 15, 0.7);
        border: 1px solid rgba(246, 91, 80, 0.45);
        border-radius: 0.75rem;
        text-align: left;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .error-title {
        color: var(--danger);
        font-size: 0.84rem;
        font-weight: 700;
        margin: 0 0 0.4rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .error-body {
        color: #ffcfc8;
        font-size: 0.8rem;
        line-height: 1.45;
        margin: 0 0 0.6rem;
        word-break: break-word;
        font-family: 'SFMono-Regular', Consolas, monospace;
      }

      .error-hint {
        color: var(--text-muted);
        font-size: 0.74rem;
        line-height: 1.4;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="splash-card">
      <div class="brand-orbit">
        <div id="orbit-ring" class="orbit-ring"></div>
        <div id="glyph" class="music-glyph">&#9835;</div>
      </div>

      <h1 class="title">RHYTHMIC RIDDLES</h1>
      <div class="subtitle">Real-time Music Quiz Game</div>

      <div id="status-pill" class="status-pill">
        <span class="pulse-dot"></span>
        <span id="pill-text">Starting Services</span>
      </div>

      <div id="equalizer" class="equalizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>

      <div id="status-msg" class="status-msg">Initializing Spring Boot backend...</div>
      <div id="target-url" class="target-url">http://localhost:8080/</div>

      <div id="error-panel" class="error-panel">
        <div class="error-title">
          <span>&#9888;</span>
          <span>Startup Failure</span>
        </div>
        <p id="error-body" class="error-body"></p>
        <p class="error-hint">Please resolve the error above or check application logs and restart.</p>
      </div>
    </div>

    <script>
      (function() {
        var pollUrl = '/status';
        var redirecting = false;
        var intervalMs = 200;

        function checkStatus() {
          if (redirecting) return;

          var xhr = new XMLHttpRequest();
          xhr.open('GET', pollUrl + '?t=' + Date.now(), true);
          xhr.timeout = 2000;

          xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4) return;
            if (xhr.status === 200) {
              try {
                var data = JSON.parse(xhr.responseText);
                handleState(data);
              } catch (e) {
                // JSON parse error, retry
                scheduleNext();
              }
            } else {
              scheduleNext();
            }
          };

          xhr.onerror = function() { scheduleNext(); };
          xhr.ontimeout = function() { scheduleNext(); };

          try {
            xhr.send();
          } catch (e) {
            scheduleNext();
          }
        }

        function scheduleNext() {
          if (!redirecting) {
            setTimeout(checkStatus, intervalMs);
          }
        }

        function handleState(data) {
          var target = data.targetUrl || 'http://localhost:8080/';
          document.getElementById('target-url').textContent = target;

          if (data.status === 'READY') {
            redirecting = true;
            document.getElementById('orbit-ring').className = 'orbit-ring ready';
            document.getElementById('status-pill').className = 'status-pill ready';
            document.getElementById('pill-text').textContent = 'Ready';
            document.getElementById('status-msg').textContent = 'Redirecting to application...';

            // Replace current history entry so the splash page does not remain in history
            window.location.replace(target);
            return;
          }

          if (data.status === 'FAILED') {
            redirecting = true;
            document.getElementById('orbit-ring').className = 'orbit-ring failed';
            document.getElementById('glyph').className = 'music-glyph failed';
            document.getElementById('glyph').innerHTML = '&#10006;';
            document.getElementById('status-pill').className = 'status-pill failed';
            document.getElementById('pill-text').textContent = 'Startup Failed';
            document.getElementById('equalizer').style.display = 'none';
            document.getElementById('status-msg').textContent = 'Could not start application';

            var errorPanel = document.getElementById('error-panel');
            var errorBody = document.getElementById('error-body');
            errorBody.textContent = data.error || 'Unknown error occurred while bootstrapping Spring Boot.';
            errorPanel.style.display = 'block';
            return;
          }

          scheduleNext();
        }

        setTimeout(checkStatus, 100);
      })();
    </script>
  </body>
</html>
