[platformio]
src_dir = .
test_dir = test
default_envs = native

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = no
build_flags = -I.

[env:nanoatmega328]
platform = atmelavr@5.3.0
board = nanoatmega328
framework = arduino
lib_deps = sui77/rc-switch@2.6.4
build_src_filter =
  +<*>
  -<test/>
  -<.pio/>
